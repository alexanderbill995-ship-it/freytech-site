name: Deploy review preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_SHOW_CONFIRM_FLAGS: "true"
          NEXT_PUBLIC_CONFIRM_STYLE: generic
          NEXT_PUBLIC_PREVIEW: "true"
          # Lead delivery: FormSubmit AJAX relay to the address FreyTech already publishes. See docs/FORM-DELIVERY-DECISION.md.
          NEXT_PUBLIC_FORM_ENDPOINT: https://formsubmit.co/ajax/info@freytech.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
